version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sc-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sc-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sc-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sc-backend
    environment:
      DB_HOST: sc-db
      DB_PORT: 5432
      DB_NAME: sc-db
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sc-frontend
    environment:
      API_TARGET: http://sc-backend:8000
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  etl:
    build: ./ETL
    container_name: sc-etl
    environment:
      DB_HOST: sc-db
      DB_PORT: 5432
      DB_NAME: sc-db
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: sc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
  maven-cache: